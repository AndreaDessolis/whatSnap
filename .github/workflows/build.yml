name: Build whatSnap
on:
  # Only master and pull requests into it build, to keep artifact storage under the quota.
  # Only master publishes a release (see the release job).
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
# One run per branch at a time. The release job below keeps its own queue, so a cancelled run
# cannot leave a half-published set of assets behind.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-windows:
    # Forks of this repository don't run it (and don't email their owners failures).
    if: github.repository_owner == 'aryanchoudharypro'
    # arm64 builds natively on GitHub's Windows arm64 runner; its packages are named -arm64.
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: windows-latest
        - arch: arm64
          runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    # build.rs runs `go build` for backend.exe, so Go has to be on PATH before cargo starts.
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum
    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
    # Inno Setup isn't installed here: cargo release downloads a pinned copy
    # (shipfitter's tools::iscc) when it can't find one.
    - name: Install CMake and Ninja
      run: choco install cmake ninja -y --no-progress
    # Produces target\release\whatSnap.zip and whatSnap_setup.exe, each with a .minisig
    # signature that the in-app update check verifies.
    - name: Build and sign
      env:
        MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      run: cargo release
    - name: Check the build produced both packages
      run: |
        $suffix = if ('${{ matrix.arch }}' -eq 'arm64') { '-arm64' } else { '' }
        foreach ($pattern in "whatSnap_setup$suffix.exe", "whatSnap$suffix.zip") {
          if (-not (Get-ChildItem target\release -Filter $pattern)) { throw "target\release\$pattern is missing" }
        }
        Get-ChildItem target\release -Filter whatSnap* | Format-Table Name, Length
    - name: Upload installer
      id: upload-setup
      uses: actions/upload-artifact@v7
      with:
        name: whatSnap-windows-setup-${{ matrix.arch }}
        path: target/release/whatSnap_setup*.exe*
        if-no-files-found: error
        retention-days: 1
    - name: Upload portable zip
      uses: actions/upload-artifact@v7
      with:
        name: whatSnap-windows-portable-${{ matrix.arch }}
        path: target/release/whatSnap*.zip*
        if-no-files-found: error
        retention-days: 1
    - name: Link the installer in the run summary
      run: |
        echo "Installer (${{ matrix.arch }}): ${{ steps.upload-setup.outputs.artifact-url }}" >> $env:GITHUB_STEP_SUMMARY

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    # The daily WhatsApp version job uses workflow_dispatch because its token's push
    # doesn't trigger workflows. Those builds must publish updates too.
    if: github.repository_owner == 'aryanchoudharypro' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    # Every run publishes to the same `latest` release, so two of them uploading at once
    # interleave their assets. Queue them instead of cancelling, so each run publishes a
    # complete, self-consistent set.
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Download installers and portable zips
      uses: actions/download-artifact@v8
      with:
        pattern: whatSnap-windows-*
        merge-multiple: true
        path: windows-build
    # The update check's dev channel reads these lines, newest first, as
    # "- <7-character hash> <subject>", to tell a build which commits are new to it.
    # Always include HEAD, even when it has a version tag. A tag..HEAD range is
    # empty on release day, which makes already-installed copies report up to date.
    - name: Generate release notes
      shell: bash
      run: |
        {
          printf '## Recent commits\n\n'
          # Force exactly seven characters: git's %h can grow as the repo grows,
          # but existing updaters compare it against a seven-character local hash.
          git log -50 --format='- %H %s' HEAD | sed -E 's/^- ([0-9a-f]{7})[0-9a-f]+ /- \1 /'
        } > dev-release-notes.md
    # A queued run whose commit has since been superseded would otherwise replace the newer
    # build with its own older one.
    - name: Check this is still the head of master
      id: freshness
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/master" --jq .sha)
        if [ "$HEAD_SHA" = "${{ github.sha }}" ]; then
          echo "current=true" >> $GITHUB_OUTPUT
        else
          echo "current=false" >> $GITHUB_OUTPUT
          echo "::notice::master has moved on to $HEAD_SHA, leaving the release to that build"
        fi
    - name: Create or update latest release
      if: steps.freshness.outputs.current == 'true'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: latest
        name: Development Build
        body_path: dev-release-notes.md
        files: windows-build/*
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
